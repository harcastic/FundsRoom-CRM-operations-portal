name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Application to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H -t rsa,ed25519 "${{ secrets.AWS_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync Repository Files to AWS EC2
        run: |
          rsync -avz --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude 'frontend/node_modules' \
            --exclude 'backend/node_modules' \
            --exclude 'frontend/dist' \
            --exclude 'backend/dist' \
            --exclude '.env' \
            ./ ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }}:/home/${{ secrets.AWS_USER }}/crm-operation/

      - name: Execute Deployment Commands on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            cd /home/${{ secrets.AWS_USER }}/crm-operation

            # Generate dynamic .env from secrets without hardcoding
            cat << 'EOF' > .env
            PORT=5000
            NODE_ENV=production
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRES_IN=1d
            CLIENT_URL=${{ secrets.CLIENT_URL }}
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            EOF

            # Restart containers with updated code and dynamic environment
            docker compose down
            docker compose --env-file .env up -d --build

            # Clean up old unused docker images
            docker image prune -f
