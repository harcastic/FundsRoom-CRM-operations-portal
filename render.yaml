services:
  - type: web
    name: crm-operation-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run migrate:prod && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: CLIENT_URL
        sync: false
